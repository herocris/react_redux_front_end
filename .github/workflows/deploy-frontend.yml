name: Check and Deploy React Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  checks:
    name: Tests, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint without warnings
        run: npm run lint -- --max-warnings=0

      - name: Build project
        run: npm run build

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Instalar dependencias desde la raíz del repo
      - name: Install dependencies
        run: npm ci

      # Crear archivo .env usando el secret REACT_ENV
      - name: Prepare .env for build
        env:
          REACT_ENV: ${{ secrets.REACT_ENV }}
        run: |
          printf '%s\n' "$REACT_ENV" > .env

      # Build de producción
      - name: Build project
        run: npm run build

      # Crear ZIP del dist
      - name: Create deployment package
        run: zip -r dist.zip dist

      # Subir dist.zip al droplet
      - name: Upload frontend package
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "dist.zip"
          target: "/root/laravel_react_js_app"

      # Reemplazar dist en el servidor
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/laravel_react_js_app

            # eliminar dist anterior
            rm -rf react-frontend-app/dist

            # descomprimir nueva versión
            unzip dist.zip -d react-frontend-app
            rm dist.zip

            # reiniciar nginx si está en docker
            docker compose restart nginx || true
